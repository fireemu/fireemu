name: conformance

# Opt-in only. This is deliberately not a pull-request gate: recording downloads a 136 MB
# Firestore emulator jar and needs Java, and even `check` starts a daemon, a Node runner and a
# functions codebase per variant. Run it from the Actions tab when the corpus, the fixtures, the
# pinned `firebase-tools` version or an App Check / Firestore / Auth / Storage / Functions wire
# behaviour changed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          check: replay fireemu against the committed fixtures (no Java, no oracle).
          record: also run the official Local Emulator Suite and report the fixture diff.
        type: choice
        options: [check, record]
        default: check
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history: the selftest verifies every hop of harness-lineage.json against it and
      # fails on a shallow clone.
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: pnpm/action-setup@v4.3.0
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6.8.0
      # Only the oracle needs a JVM, but installing it unconditionally keeps the two modes
      # otherwise identical, so a `record` run cannot differ from a `check` run by setup.
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"

      - name: install the pinned conformance toolchain
        run: pnpm -C conformance install --frozen-lockfile

      # The frozen federation certificate fixtures (and the gate's own tests of them) need the req
      # validity flags of OpenSSL 3.4; the runner's OpenSSL is older. Same pinned build the release uses.
      - name: pinned OpenSSL for the frozen federation certificate fixtures
        run: |
          sh npm/scripts/install-federation-openssl.sh "$RUNNER_TEMP/fireemu-federation-openssl"
          echo "$RUNNER_TEMP/fireemu-federation-openssl/bin" >> "$GITHUB_PATH"
          echo "FIREEMU_FEDERATION_OPENSSL_DIR=$RUNNER_TEMP/fireemu-federation-openssl/bin" >> "$GITHUB_ENV"

      - name: the gate's own tests
        run: pnpm -C conformance run selftest

      - name: validate Python corpus exporters
        run: uv run --with pytest pytest -q conformance/src/firestore-probe/test_*export.py conformance/src/firestore-probe/test_sandbox_expansion.py

      - name: lint and format
        run: |
          pnpm -C conformance run lint
          pnpm -C conformance run fmt:check

      - name: build fireemu
        run: cargo build --release -p fireemu

      - name: replay against the committed fixtures
        env:
          FIREEMU_BIN: ${{ github.workspace }}/target/release/fireemu
        run: pnpm -C conformance run check

      # The strict profile (productionExact) serves the HOSTING production corpus on loopback and must
      # reproduce the three committed comparisons with the two production recordings. The selftest
      # runs this test too, but skips it without a binary.
      - name: strict replay of the Hosting recordings
        env:
          FIREEMU_BIN: ${{ github.workspace }}/target/release/fireemu
        run: node --test conformance/src/hosting-production/strict-replay.test.mjs

      # The same for the task queue program: strict (productionExact) against the two recordings of 2026-11-11.
      - name: strict replay of the task queue recordings
        env:
          FIREEMU_BIN: ${{ github.workspace }}/target/release/fireemu
        run: node --test conformance/src/task-queue-production/strict-replay.test.mjs

      # The same for the FS-DATA-WRITE Batch 3 recordings of 2026-11-17 (the two production attempts of
      # the commit budget, composite and collection-group entries, bytes line breaks and the
      # Write-stream delete): strict against all 64 recipes, in both local attempts.
      - name: strict replay of the Batch 3 write-limit recordings
        env:
          FIREEMU_BIN: ${{ github.workspace }}/target/release/fireemu
        run: node --test conformance/src/fs-write-limits-replay.test.mjs

      # `record` re-derives the fixtures from the official emulators. It never commits: a
      # difference is reported as a diff so that an upstream change becomes an explicit review
      # rather than a silently updated baseline.
      - name: re-record against the official Local Emulator Suite
        if: inputs.mode == 'record'
        env:
          FIREEMU_BIN: ${{ github.workspace }}/target/release/fireemu
        run: pnpm -C conformance run oracle

      - name: report the fixture diff
        if: inputs.mode == 'record'
        run: |
          if git diff --quiet -- conformance/fixtures conformance/ORACLE.md conformance/DEBT.md; then
            echo "The committed fixtures still describe the pinned oracle."
          else
            echo "::warning::Re-recording changed the fixtures; review the diff below."
            git --no-pager diff -- conformance/fixtures conformance/ORACLE.md conformance/DEBT.md
          fi

      - name: upload the raw runs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: conformance-runs
          path: conformance/.runs/
          if-no-files-found: ignore
