name: kani

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.100.0"
      - name: verify the pinned toolchain
        run: >-
          rustc --version | tee /dev/stderr | grep -q "$(sed -n 's/^channel = \"\(.*\)\"/\1/p' rust-toolchain.toml)"
      - name: install Kani
        run: cargo install --locked kani-verifier --version 0.67.0
      - name: set up Kani
        run: cargo kani setup
      - name: test Kani runner
        run: python3 -m unittest discover -s verification/kani -p 'test_*.py'
      - name: run bounded proofs
        run: python3 verification/kani/run.py
